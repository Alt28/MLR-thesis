services:
  - type: web
    name: alt28-mlr-thesis-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MLR_STORAGE_DIR
        value: /tmp/mlr-web-data
      - key: MLR_ALLOWED_ORIGINS
        value: https://mlr-sigma.vercel.app
